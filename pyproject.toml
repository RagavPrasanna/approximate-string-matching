[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "approximate-string-matching"
version = "1.0.0"
description = "Design, analysis, and experimental comparison of approximate string matching algorithms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "pandas>=2.0",
  "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
asm = "asm.cli:main"

[tool.setuptools.packages.find]
include = ["asm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
